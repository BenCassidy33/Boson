edition = "2024"

[dependencies]
anyhow = "1.0.104"
bon = "3.10.3"
eframe = "0.37.0"
env_logger = "0.11.12"
fontdb = "0.24.0"
lightningcss = "1.0.0-alpha.72"
log = "0.4.35"
